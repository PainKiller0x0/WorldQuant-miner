version: '3.8'

networks:
  wq-network:
    name: wq-network-shared
    driver: bridge

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile # 确保指向了正确的Dockerfile
    container_name: wq-dashboard
    volumes:
      - ./logs:/app/logs
      - ./hopeful_alphas.json:/app/hopeful_alphas.json
      - ./tested_alphas_log.json:/app/tested_alphas_log.json
      # --- v5.7 状态持久化修复 (交接任务) ---
      - ./submitted_alphas.json:/app/submitted_alphas.json
      - ./failed_submissions.json:/app/failed_submissions.json
      # --- 修复结束 ---
      - ./Web仪表盘.py:/app/Web仪表盘.py # 挂载后台文件
      - ./templates:/app/templates   # 挂载整个templates文件夹
      # --- v5.8 (版本显示) 新增 ---
      - ./alpha_generator_ollama.py:/app/alpha_generator_ollama.py:ro
      - ./system_config.json:/app/system_config.json # <--- v8.0 新增
    command: python -u Web仪表盘.py # 运行新的后台脚本
    ports:
      - "8080:8080"
    networks:
      - wq-network
    restart: always