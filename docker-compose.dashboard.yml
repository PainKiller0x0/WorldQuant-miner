version: '3.8'

networks:
  wq-network:
    name: wq-network-shared
    driver: bridge

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile # 确保指向了正确的Dockerfile
    container_name: wq-dashboard
    volumes:
      - ./logs:/app/logs
      - ./hopeful_alphas.json:/app/hopeful_alphas.json
      - ./tested_alphas_log.json:/app/tested_alphas_log.json
      - ./Web仪表盘.py:/app/Web仪表盘.py # 挂载后台文件
      - ./templates:/app/templates   # 挂载整个templates文件夹
    command: python -u Web仪表盘.py # 运行新的后台脚本
    ports:
      - "8080:8080"
    networks:
      - wq-network
    restart: always