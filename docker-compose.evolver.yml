version: '3.8'

# --- [核心修正] 补上网络定义 ---
networks:
  wq-network:
    name: wq-network-shared
    driver: bridge

services:
  evolver:
    build: .
    container_name: wq-evolver
    environment:
      - WQ_USER_ID=${WQ_USER_ID}
      - WQ_API_KEY=${WQ_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./hopeful_alphas.json:/app/hopeful_alphas.json
      - ./tested_alphas_log.json:/app/tested_alphas_log.json
      - ./api_config.json:/app/api_config.json
    command: >
      sh -c "python -u alpha_generator_ollama.py
      --user-id ${WQ_USER_ID}
      --api-key ${WQ_API_KEY}
      --batch-size 3
      --concurrency 1
      --mode evolve
      --sleep 600"
    networks:
      - wq-network
    restart: always