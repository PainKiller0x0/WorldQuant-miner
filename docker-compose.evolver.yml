# ⚠️ 已移除 version: 字段，因为 Compose v2 已弃用

networks:
  wq-network:
    name: wq-network-shared
    driver: bridge

services:
  evolver:
    build: .
    container_name: wq-evolver
    environment:
      - WQ_USER_ID=${WQ_USER_ID}
      - WQ_API_KEY=${WQ_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./hopeful_alphas.json:/app/hopeful_alphas.json
      - ./tested_alphas_log.json:/app/tested_alphas_log.json
      - ./api_config.json:/app/api_config.json
      - ./alpha_generator_ollama.py:/app/alpha_generator_ollama.py:ro
      - ./invalid_functions.json:/app/invalid_functions.json
      - ./system_config.json:/app/system_config.json
      
      # --- v13.1: 修复 failure_log.json 找不到的 Bug ---
      - ./submission_failure_log.json:/app/submission_failure_log.json
      # --- v13.1: 修复结束 ---
      
      # --- v9.0 模块化修复 (已存在, v13.0 依赖此配置) ---
      - ./utils.py:/app/utils.py:ro
      - ./wq_client.py:/app/wq_client.py:ro
      - ./llm_provider.py:/app/llm_provider.py:ro
      # 添加这行:
      - ./hopeful_alphas.json.lock:/app/hopeful_alphas.json.lock
      # 添加这行:
      - ./system_config.json.lock:/app/system_config.json.lock
      # 添加这行:
      - ./invalid_functions.json.lock:/app/invalid_functions.json.lock
      - ./wq_miner.db:/app/wq_miner.db  # <--- 新增数据库挂载
    command: >
      sh -c "python -u alpha_generator_ollama.py
      --user-id ${WQ_USER_ID}
      --api-key ${WQ_API_KEY}
      --batch-size 3
      --mode evolve    
      --log-file evolver.log"
    networks:
      - wq-network
    restart: always