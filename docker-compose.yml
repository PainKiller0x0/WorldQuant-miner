# === 粘贴替换掉旧的 docker-compose.yml ===
services:
  miner:
    build: .
    container_name: wq-miner
    environment:
      - WQ_USER_ID=${WQ_USER_ID}
      - WQ_API_KEY=${WQ_API_KEY}
    ports:
      - "5001:5001"
    volumes:
      - ./logs:/app/logs
      - ./hopeful_alphas.json:/app/hopeful_alphas.json
      - ./提交日志.json:/app/提交日志.json
      - ./credential.txt:/app/credential.txt
      - ./tested_alphas.json:/app/tested_alphas.json
      - ./api_config.json:/app/api_config.json # <-- 挂载新的API配置文件
    command: >
      sh -c "python -u Web仪表盘.py &
      python -u alpha_orchestrator.py
      --credentials credential.txt
      --batch-size 2 
      --mode continuous"
    restart: always