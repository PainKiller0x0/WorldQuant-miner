version: '3.8'

networks:
  wq-network:
    name: wq-network-shared
    driver: bridge

services:
  miner:
    build: .
    container_name: wq-miner
    environment:
      - WQ_USER_ID=${WQ_USER_ID}
      - WQ_API_KEY=${WQ_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./hopeful_alphas.json:/app/hopeful_alphas.json
      - ./提交日志.json:/app/提交日志.json
      - ./credential.txt:/app/credential.txt
      - ./tested_alphas.json:/app/tested_alphas.json
      - ./api_config.json:/app/api_config.json
    command: >
      sh -c "python -u alpha_orchestrator.py
      --credentials credential.txt
      --batch-size 5
      --mode continuous"
    networks:
      - wq-network
    restart: always