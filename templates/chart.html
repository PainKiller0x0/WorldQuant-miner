<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计图表 - WQ 监控</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        [data-bs-theme="dark"] body {
            background-color: #212529;
        }
        .chart-container {
            position: relative;
            height: 40vh;
            width: 100%;
        }
        .theme-toggle {
            cursor: pointer;
            font-size: 1.25rem;
            padding: 0.5rem 0.75rem;
            color: var(--bs-nav-link-color);
        }
        .theme-toggle:hover {
            color: var(--bs-nav-link-hover-color);
        }
        .theme-toggle .bi-sun-fill { display: none; }
        .theme-toggle .bi-moon-stars-fill { display: block; }
        [data-bs-theme="dark"] .theme-toggle .bi-sun-fill { display: block; }
        [data-bs-theme="dark"] .theme-toggle .bi-moon-stars-fill { display: none; }
    </style>
</head>
<body>
    <div class="container-fluid mt-3">
        <nav class="nav nav-tabs">
            <a class="nav-link" href="/">
                <i class="bi bi-speedometer2"></i> 主仪表盘
            </a>
            <a class="nav-link" href="/settings">
                <i class="bi bi-gear-fill"></i> 全局设置
            </a>
            <a class="nav-link active" aria-current="page" href="/chart">
                <i class="bi bi-bar-chart-line-fill"></i> 统计图表
            </a>
            <a class="nav-link" href="/pending">
                <i class="bi bi-clipboard-data-fill"></i> 待提交列表
            </a>
            <a class="nav-link ms-auto theme-toggle" id="theme-toggler" title="切换亮色/暗色模式">
                <i class="bi bi-sun-fill"></i>
                <i class="bi bi-moon-stars-fill"></i>
            </a>
        </nav>

        <div id="error-container" class="alert alert-danger mt-3" style="display: none;" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i> 
            <strong>加载图表数据失败:</strong> <span id="error-message"></span>
        </div>

        <div class="row mt-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>产出效率 (按小时) <small class="text-muted">(v13.3.14: 已合并无数据时段)</small></h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="hourlyProductionChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-3 mb-5">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>每日概览 (按天) <small class="text-muted">(v13.3.14: 已合并无数据日期)</small></h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="dailySubmissionChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/chart.umd.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const errorContainer = document.getElementById('error-container');
            const errorMessage = document.getElementById('error-message');
            let hourlyChart = null;
            let dailyChart = null;
            
            // --- v13.3.12: 夜间模式逻辑 ---
            const THEME_KEY = 'theme-preference';
            const htmlEl = document.documentElement;

            function getCurrentTheme() {
                return htmlEl.getAttribute('data-bs-theme');
            }

            function loadThemePreference() {
                const preference = localStorage.getItem(THEME_KEY);
                if (preference) {
                    htmlEl.setAttribute('data-bs-theme', preference);
                }
                updateChartDefaults(getCurrentTheme());
            }

            document.getElementById('theme-toggler').addEventListener('click', () => {
                const currentTheme = getCurrentTheme();
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                htmlEl.setAttribute('data-bs-theme', newTheme);
                localStorage.setItem(THEME_KEY, newTheme);
                updateChartDefaults(newTheme);
            });

            function updateChartDefaults(theme) {
                const gridColor = theme === 'dark' ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
                const labelColor = theme === 'dark' ? 'rgba(255, 255, 255, 0.7)' : 'rgba(0, 0, 0, 0.7)';
                Chart.defaults.borderColor = gridColor;
                Chart.defaults.color = labelColor;
                if (hourlyChart) hourlyChart.update();
                if (dailyChart) dailyChart.update();
            }
            
            loadThemePreference();
            // --- v13.3.12: 结束 ---

            function showError(message) {
                errorMessage.textContent = message;
                errorContainer.style.display = 'block';
            }

            // 加载时间序列图表 (产出效率)
            function loadHourlyChart() {
                fetch('/api/v1/stats/timeseries', { cache: 'no-store' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) throw new Error(data.error);
                        
                        const ctx = document.getElementById('hourlyProductionChart').getContext('2d');
                        if (hourlyChart) hourlyChart.destroy();
                        
                        hourlyChart = new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: data.timestamps,
                                datasets: [
                                    {
                                        label: '总产出 Alpha 数 (每小时)',
                                        data: data.count,
                                        backgroundColor: 'rgba(0, 123, 255, 0.5)',
                                        borderColor: 'rgba(0, 123, 255, 1)',
                                        borderWidth: 1,
                                        yAxisID: 'y'
                                    },
                                    {
                                        label: '高质量 Alpha 数 (每小时)',
                                        data: data.high_quality_count,
                                        backgroundColor: 'rgba(40, 167, 69, 0.5)',
                                        borderColor: 'rgba(40, 167, 69, 1)',
                                        borderWidth: 1,
                                        yAxisID: 'y'
                                    },
                                    {
                                        label: '平均 Fitness (每小时)',
                                        data: data.mean_fitness,
                                        type: 'line',
                                        borderColor: '#fd7e14',
                                        backgroundColor: '#fd7e14',
                                        yAxisID: 'y1',
                                        tension: 0.1
                                    }
                                ]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    // --- v13.3.14: 关键修复 ---
                                    x: {
                                        type: 'category', // <-- 修复: 从 'time' 改为 'category'
                                        title: { display: true, text: '时间 (已合并空隙)' },
                                        ticks: {
                                            // 自动跳过标签，防止重叠
                                            autoSkip: true,
                                            maxTicksLimit: 15 
                                        }
                                    },
                                    // --- v13.3.14: 结束 ---
                                    y: {
                                        type: 'linear', position: 'left', beginAtZero: true,
                                        title: { display: true, text: '数量' }
                                    },
                                    y1: {
                                        type: 'linear', position: 'right',
                                        title: { display: true, text: 'Fitness' },
                                        grid: { drawOnChartArea: false }
                                    }
                                }
                            }
                        });
                    })
                    .catch(error => {
                        console.error('Error loading hourly chart:', error);
                        showError(`[产出效率图表] ${error.message}`);
                    });
            }

            // 加载每日概览图表
            function loadDailyChart() {
                fetch('/api/v1/stats/submission_daily', { cache: 'no-store' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) throw new Error(data.error);
                        
                        const ctx = document.getElementById('dailySubmissionChart').getContext('2d');
                        if (dailyChart) dailyChart.destroy();
                        
                        dailyChart = new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: data.timestamps,
                                datasets: [
                                    {
                                        label: '每日产出 (可提交) Alpha 数量',
                                        data: data.submittable_count, 
                                        backgroundColor: 'rgba(40, 167, 69, 0.6)',
                                        borderColor: 'rgba(40, 167, 69, 1)',
                                        borderWidth: 1
                                    },
                                    {
                                        label: '每日手动提交 Alpha 数量',
                                        data: data.submitted_count,
                                        backgroundColor: 'rgba(0, 123, 255, 0.6)',
                                        borderColor: 'rgba(0, 123, 255, 1)',
                                        borderWidth: 1
                                    },
                                    {
                                        label: '每日标记失败 Alpha 数量',
                                        data: data.failed_count,
                                        backgroundColor: 'rgba(220, 53, 69, 0.6)',
                                        borderColor: 'rgba(220, 53, 69, 1)',
                                        borderWidth: 1
                                    }
                                ]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    // --- v13.3.14: 关键修复 ---
                                    x: {
                                        type: 'category', // <-- 修复: 从 'time' 改为 'category'
                                        title: { display: true, text: '日期 (已合并空隙)' },
                                        ticks: {
                                            // 自动跳过标签，防止重叠
                                            autoSkip: true,
                                            maxTicksLimit: 20
                                        }
                                    },
                                    // --- v13.3.14: 结束 ---
                                    y: {
                                        beginAtZero: true,
                                        title: { display: true, text: '数量' }
                                    }
                                }
                            }
                        });
                    })
                    .catch(error => {
                        console.error('Error loading daily chart:', error);
                        showError(`[每日概览图表] ${error.message}`);
                    });
            }

            loadHourlyChart();
            loadDailyChart();
        });
    </script>
</body>
</html>
