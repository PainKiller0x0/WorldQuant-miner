<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>统计图表 - WQ Alpha 舰队</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif; transition: background-color 0.3s; }
        .chart-container { position: relative; height: 40vh; width: 100%; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top shadow-sm mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-primary" href="/"><i class="bi bi-cpu-fill"></i> WQ Alpha 舰队</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> 仪表盘</a></li>
        <li class="nav-item"><a class="nav-link active" href="/chart"><i class="bi bi-graph-up"></i> 统计图表</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings"><i class="bi bi-sliders"></i> 设置</a></li>
        <li class="nav-item"><a class="nav-link" href="/pending"><i class="bi bi-hourglass-split"></i> 待处理</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-secondary bg-opacity-25 text-body-secondary border border-secondary-subtle d-none d-md-inline">
            Dash: <span id="dashboard-version">...</span> | Gen: <span id="generator-version">...</span>
        </span>
        <button class="btn btn-outline-secondary btn-sm rounded-circle" id="theme-toggle"><i class="bi bi-moon-stars-fill"></i></button>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">
    <div id="error-container" class="alert alert-danger" style="display: none;" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> 
        <strong>加载图表数据失败:</strong> <span id="error-message"></span>
    </div>

    <div class="row mb-4">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-body-tertiary">
                    <h5 class="mb-0">产出效率 (按小时) <small class="text-muted fs-6">(v13.3.14: 已合并无数据时段)</small></h5>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="hourlyProductionChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-5">
        <div class="col-12">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-body-tertiary">
                    <h5 class="mb-0">每日概览 (按天) <small class="text-muted fs-6">(v13.3.14: 已合并无数据日期)</small></h5>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="dailySubmissionChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/chart.umd.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const errorContainer = document.getElementById('error-container');
        const errorMessage = document.getElementById('error-message');
        let hourlyChart = null;
        let dailyChart = null;
        
        // --- 主题与版本号逻辑 ---
        const THEME_KEY = 'theme-preference';
        const htmlEl = document.documentElement;
        const themeToggle = document.getElementById('theme-toggle');

        function setTheme(theme) {
            htmlEl.setAttribute('data-bs-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            themeToggle.innerHTML = theme === 'dark' ? '<i class="bi bi-moon-stars-fill"></i>' : '<i class="bi bi-sun-fill"></i>';
            updateChartDefaults(theme);
        }

        const storedTheme = localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        setTheme(storedTheme);

        themeToggle.addEventListener('click', () => {
            setTheme(htmlEl.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
        });

        function updateChartDefaults(theme) {
            const gridColor = theme === 'dark' ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)';
            const labelColor = theme === 'dark' ? 'rgba(255, 255, 255, 0.7)' : 'rgba(0, 0, 0, 0.7)';
            Chart.defaults.borderColor = gridColor;
            Chart.defaults.color = labelColor;
            if (hourlyChart) hourlyChart.update();
            if (dailyChart) dailyChart.update();
        }

        // 获取版本号
        fetch('/api/version_info').then(r=>r.json()).then(d=>{
            const dbVer = document.getElementById('dashboard-version');
            if(dbVer) dbVer.textContent = d.dashboard_version;
            const genVer = document.getElementById('generator-version');
            if(genVer) genVer.textContent = d.generator_version;
        }).catch(e=>console.error("Ver info error:", e));
        // --- 结束 ---

        function showError(message) {
            errorMessage.textContent = message;
            errorContainer.style.display = 'block';
        }

        // 加载时间序列图表 (产出效率)
        function loadHourlyChart() {
            fetch('/api/v1/stats/timeseries', { cache: 'no-store' })
                .then(response => response.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    
                    const ctx = document.getElementById('hourlyProductionChart').getContext('2d');
                    if (hourlyChart) hourlyChart.destroy();
                    
                    hourlyChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.timestamps,
                            datasets: [
                                { label: '总产出 Alpha 数', data: data.count, backgroundColor: 'rgba(0, 123, 255, 0.5)', borderColor: 'rgba(0, 123, 255, 1)', borderWidth: 1, yAxisID: 'y' },
                                { label: '高质量 Alpha 数', data: data.high_quality_count, backgroundColor: 'rgba(40, 167, 69, 0.5)', borderColor: 'rgba(40, 167, 69, 1)', borderWidth: 1, yAxisID: 'y' },
                                { label: '平均 Fitness', data: data.mean_fitness, type: 'line', borderColor: '#fd7e14', backgroundColor: '#fd7e14', yAxisID: 'y1', tension: 0.1 }
                            ]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            scales: {
                                x: { type: 'category', title: { display: true, text: '时间' }, ticks: { autoSkip: true, maxTicksLimit: 15 } },
                                y: { type: 'linear', position: 'left', beginAtZero: true, title: { display: true, text: '数量' } },
                                y1: { type: 'linear', position: 'right', title: { display: true, text: 'Fitness' }, grid: { drawOnChartArea: false } }
                            }
                        }
                    });
                })
                .catch(error => { console.error(error); showError(`[产出效率] ${error.message}`); });
        }

        // 加载每日概览图表
        function loadDailyChart() {
            fetch('/api/v1/stats/submission_daily', { cache: 'no-store' })
                .then(response => response.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    
                    const ctx = document.getElementById('dailySubmissionChart').getContext('2d');
                    if (dailyChart) dailyChart.destroy();
                    
                    dailyChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.timestamps,
                            datasets: [
                                { label: '可提交', data: data.submittable_count, backgroundColor: 'rgba(40, 167, 69, 0.6)', borderColor: 'rgba(40, 167, 69, 1)', borderWidth: 1 },
                                { label: '已手动提交', data: data.submitted_count, backgroundColor: 'rgba(0, 123, 255, 0.6)', borderColor: 'rgba(0, 123, 255, 1)', borderWidth: 1 },
                                { label: '标记失败', data: data.failed_count, backgroundColor: 'rgba(220, 53, 69, 0.6)', borderColor: 'rgba(220, 53, 69, 1)', borderWidth: 1 }
                            ]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            scales: {
                                x: { type: 'category', title: { display: true, text: '日期' }, ticks: { autoSkip: true, maxTicksLimit: 20 } },
                                y: { beginAtZero: true, title: { display: true, text: '数量' } }
                            }
                        }
                    });
                })
                .catch(error => { console.error(error); showError(`[每日概览] ${error.message}`); });
        }

        loadHourlyChart();
        loadDailyChart();
    });
</script>
</body>
</html>
