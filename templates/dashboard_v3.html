<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Miner 仪表盘 v3</title>
    <style>
        :root {
            --bg-gradient-start: #1e293b;
            --bg-gradient-end: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --status-green: #22c55e;
            --status-yellow: #f59e0b;
            --status-red: #ef4444;
            --status-gray: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header { margin-bottom: 2rem; }
        header h1 { font-size: 2.5rem; }
        header p { color: var(--text-secondary); font-size: 1.1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            transition: transform 0.2s ease-in-out;
        }
        .card:hover { transform: translateY(-5px); }
        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }
        .metric { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; font-size: 1rem; }
        .metric-label { color: var(--text-secondary); }
        .metric-value { font-weight: 600; }
        .status-indicator { width: 12px; height: 12px; border-radius: 50%; margin-right: 0.75rem; }
        .status-connected, .status-active { background-color: var(--status-green); }
        .status-error, .status-auth_failed, .status-not_responding { background-color: var(--status-red); }
        .status-idle { background-color: var(--status-yellow); }
        .status-unknown { background-color: var(--status-gray); }
        .logs-card { grid-column: 1 / -1; }
        .logs-container {
            background: #020617;
            color: var(--text-secondary);
            padding: 1rem;
            border-radius: 0.5rem;
            height: 450px;
            overflow-y: auto;
            font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
        }
        .activity-item { font-size: 0.8rem; padding: 0.2rem 0; }
        .activity-time { color: var(--accent-color); margin-right: 1em; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Alpha Miner Dashboard</h1>
            <p>Real-time orchestrator monitoring and operational overview</p>
        </header>
        <div class="grid" id="status-grid">
            </div>
        <div class="card logs-card" style="margin-top: 1.5rem;">
            <h2>实时日志</h2>
            <div class="logs-container" id="logs-container">Loading...</div>
        </div>
    </div>

    <script>
        function updateUI() {
            fetch('/api/status').then(res => res.json()).then(data => {
                const grid = document.getElementById('status-grid');
                grid.innerHTML = `
                    <div class="card">
                        <h2><span id="orch-indicator" class="status-indicator"></span>编排器状态</h2>
                        <div class="metric">
                            <span class="metric-label">当前状态:</span>
                            <span class="metric-value" id="orch-status">...</span>
                        </div>
                        <div class="metric" style="flex-direction: column; align-items: flex-start;">
                            <span class="metric-label">最近活动:</span>
                            <span class="metric-value" style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.5rem; white-space: normal;" id="orch-activity">...</span>
                        </div>
                    </div>
                    <div class="card">
                        <h2><span id="conn-indicator" class="status-indicator"></span>连接状态</h2>
                        <div class="metric">
                            <span class="metric-label">API 代理:</span>
                            <span class="metric-value" id="api-status">...</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">WorldQuant Brain:</span>
                            <span class="metric-value" id="wq-status">...</span>
                        </div>
                    </div>
                    <div class="card">
                        <h2><span class="status-indicator" style="background-color: var(--accent-color);"></span>统计数据</h2>
                        <div class="metric">
                            <span class="metric-label">潜力 Alpha 数量:</span>
                            <span class="metric-value" id="stats-count">...</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">最高 Fitness:</span>
                            <span class="metric-value" id="stats-fitness">...</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">平均 Sharpe:</span>
                            <span class="metric-value" id="stats-sharpe">...</span>
                        </div>
                    </div>
                `;

                // Populate Orchestrator Card
                const orchStatus = data.orchestrator.status || 'unknown';
                document.getElementById('orch-indicator').className = 'status-indicator status-' + orchStatus;
                document.getElementById('orch-status').textContent = orchStatus;
                document.getElementById('orch-activity').textContent = data.orchestrator.last_activity || 'N/A';

                // Populate Connections Card
                const apiStatus = data.api_service.status || 'unknown';
                const wqStatus = data.worldquant.status || 'unknown';
                document.getElementById('api-status').innerHTML = `<span class="status-indicator status-${apiStatus}" style="width:10px; height:10px; vertical-align: middle;"></span> ${data.api_service.message}`;
                document.getElementById('wq-status').innerHTML = `<span class="status-indicator status-${wqStatus}" style="width:10px; height:10px; vertical-align: middle;"></span> ${data.worldquant.message}`;
                document.getElementById('conn-indicator').className = (apiStatus === 'connected' && wqStatus === 'connected') ? 'status-indicator status-connected' : 'status-indicator status-error';


                // Populate Stats Card
                document.getElementById('stats-count').textContent = data.statistics.hopeful_alphas_count || '0';
                document.getElementById('stats-fitness').textContent = data.statistics.highest_fitness || '0';
                document.getElementById('stats-sharpe').textContent = data.statistics.avg_sharpe || '0';

            }).catch(err => console.error("Failed to update status:", err));

            fetch('/api/logs').then(res => res.json()).then(data => {
                const logsContainer = document.getElementById('logs-container');
                logsContainer.textContent = data.logs.join('\\n');
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }).catch(err => console.error("Failed to fetch logs:", err));
        }

        setInterval(updateUI, 3000);
        document.addEventListener('DOMContentLoaded', updateUI);
    </script>
</body>
</html>
