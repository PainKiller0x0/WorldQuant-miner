<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpha Miner Dashboard v4.0</title>
    <style>
        :root {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #071127;
            --text-primary: #e6eef8;
            --text-secondary: #94a3b8;
            --border-color: #26364a;
            --accent-color: #38bdf8;
            --status-green: #22c55e;
            --status-yellow: #f59e0b;
            --status-red: #ef4444;
            --status-gray: #64748b;
            --log-info: #38bdf8;
            --log-warn: #f59e0b;
            --log-error: #ef4444;
        }
        .value-positive { color: var(--status-green); }
        .value-negative { color: var(--status-red); }
        /* --- [新] 增加 PENDING 颜色 --- */
        .value-pending { color: var(--status-yellow); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            color: var(--text-primary); min-height: 100vh; padding: 2rem;
        }
        .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem;}
        header { margin-bottom: 0.25rem; }
        header h1 { font-size: 2rem; }
        header p { color: var(--text-secondary); font-size: 1rem; margin-top: 0.25rem; }

        .grid { display: grid; grid-template-columns: 1fr 320px 320px; gap: 1.25rem; }
        .card {
            background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
            padding: 1.25rem; border-radius: 0.6rem; border: 1px solid var(--border-color);
            box-shadow: 0 6px 12px rgba(0,0,0,0.35);
        }
        .card h2 {
            font-size: 1.05rem; margin-bottom: 0.75rem; padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 0.5rem;
        }
        .metric { display: flex; justify-content: space-between; align-items: center; padding: 0.45rem 0; font-size: 0.95rem; }
        .metric-label { color: var(--text-secondary); }
        .metric-value { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .status-indicator { width: 12px; height: 12px; border-radius: 50%; display:inline-block; vertical-align: middle; margin-right: 0.5rem; }
        .status-connected, .status-active { background-color: var(--status-green); }
        .status-error, .status-auth_failed { background-color: var(--status-red); }
        .status-idle, .status-rate_limited { background-color: var(--status-yellow); }
        .status-unknown { background-color: var(--status-gray); }

        .logs-container { background: #030417; color: var(--text-secondary); padding: 1rem; border-radius: 0.5rem; height: 280px; overflow-y: auto; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.86rem; border: 1px solid var(--border-color); white-space: pre-wrap; }
        .log-line { padding: 2px 0; }
        .log-info { color: var(--log-info); }
        .log-warn { color: var(--log-warn); font-weight: 700; }
        .log-error { color: var(--log-error); font-weight: 700; }

        .recent-list { display:flex; flex-direction: column; gap: 0.6rem; max-height: 220px; overflow-y: auto; padding-right: 0.5rem;}
        .alpha-item { background: linear-gradient(90deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00)); padding: 0.75rem; border-radius: 0.45rem; border: 1px solid rgba(255,255,255,0.02); display:flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .alpha-meta { display:flex; flex-direction: column; gap: 0.25rem; }
        .alpha-actions { display:flex; gap: 0.5rem; align-items:center; flex-shrink: 0;}
        .btn { padding: 0.25rem 0.6rem; border-radius: 0.35rem; border: none; cursor: pointer; background: rgba(255,255,255,0.03); color: var(--text-primary); font-size: 0.85rem; }
        .small { font-size: 0.82rem; color: var(--text-secondary); }
        .muted { color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Alpha Miner Dashboard</h1>
            <p>Real-time orchestrator monitoring and operational overview</p>
        </header>

        <div class="grid" id="status-grid"></div>
        <div class="card" id="recent-alphas-card"></div>
        <div class="card">
            <h2><span class="status-indicator" style="background-color: var(--status-yellow);"></span>实时日志</h2>
            <div class="logs-container" id="logs-container">Loading...</div>
        </div>
    </div>

<script>
    let isFirstLoad = true;

    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return String(text).replace(/[&<>"']/g, m => map[m]);
    }
    
    function colorizeLog(line) {
        const escapedLine = escapeHtml(line);
        if (line.includes('WARNING') || line.includes('WARN')) return escapedLine.replace(/(WARNING|WARN)/g, '<span class="log-warn">$1</span>');
        if (line.includes('ERROR') || line.includes('失败') || line.includes('错误')) return escapedLine.replace(/(ERROR|失败|错误)/g, '<span class="log-error">$1</span>');
        if (line.includes('INFO')) return escapedLine.replace(/(INFO)/g, '<span class="log-info">$1</span>');
        return escapedLine;
    }

    function colorizeValue(value) {
        const num = parseFloat(value);
        if (isNaN(num)) return `N/A`;
        let className = '';
        if (num > 0) className = 'value-positive';
        else if (num < 0) className = 'value-negative';
        return `<span class="${className}">${num.toFixed(2)}</span>`;
    }

    // --- [新] 辅助函数，为 PASS/FAIL/PENDING 上色 ---
    function colorizeChecksSummary(summary) {
        if (!summary) return '';
        return summary
            .replace(/(\d+\s+PASS)/g, '<span class="value-positive">$1</span>')
            .replace(/(\d+\s+FAIL)/g, '<span class="value-negative">$1</span>')
            .replace(/(\d+\s+PENDING)/g, '<span class="value-pending">$1</span>');
    }

    function setupInitialLayout() {
        document.getElementById('status-grid').innerHTML = `
            <div class="card">
                <h2><span id="orch-indicator" class="status-indicator"></span>编排器状态</h2>
                <div class="metric"><span class="metric-label">当前状态:</span><span class="metric-value" id="orch-status">...</span></div>
                <div class="metric"><span class="metric-label">最近活动:</span><span class="metric-value small" id="orch-activity">...</span></div>
            </div>
            <div class="card">
                <h2><span id="conn-indicator" class="status-indicator"></span>连接状态</h2>
                <div class="metric"><span class="metric-label">API 代理:</span><span class="metric-value" id="api-status">...</span></div>
                <div class="metric"><span class="metric-label">WorldQuant Brain:</span><span class="metric-value" id="wq-status">...</span></div>
            </div>
            <div class="card">
                <h2><span class="status-indicator" style="background-color: var(--accent-color);"></span>统计数据</h2>
                <div class="metric"><span class="metric-label">潜力 Alpha 数量:</span><span class="metric-value" id="stats-count">...</span></div>
                <div class="metric"><span class="metric-label">最高 Fitness:</span><span class="metric-value" id="stats-fitness">...</span></div>
                <div class="metric"><span class="metric-label">平均 Sharpe:</span><span class="metric-value" id="stats-sharpe">...</span></div>
            </div>`;
        document.getElementById('recent-alphas-card').innerHTML = `
            <h2><span class="status-indicator" style="background-color: var(--accent-color);"></span>最近生成的 Alpha</h2>
            <div class="recent-list" id="recent-list-container"><div class="muted">Loading...</div></div>`;
    }

    function updateStatusData(data) {
        document.getElementById('orch-indicator').className = 'status-indicator status-' + (data.orchestrator.status || 'unknown');
        document.getElementById('orch-status').textContent = data.orchestrator.status || 'unknown';
        document.getElementById('orch-activity').textContent = data.orchestrator.last_activity || 'N/A';
        const apiStatus = data.api_service.status || 'unknown';
        const wqStatus = data.worldquant.status || 'unknown';
        document.getElementById('api-status').innerHTML = `<span class="status-indicator status-${apiStatus}" style="width:10px; height:10px; margin-right:6px;"></span> ${escapeHtml(data.api_service.message || '')}`;
        document.getElementById('wq-status').innerHTML = `<span class="status-indicator status-${wqStatus}" style="width:10px; height:10px; margin-right:6px;"></span> ${escapeHtml(data.worldquant.message || '')}`;
        document.getElementById('conn-indicator').className = (apiStatus === 'connected' && wqStatus === 'connected') ? 'status-indicator status-connected' : 'status-indicator status-error';
        const stats = data.statistics || {};
        document.getElementById('stats-count').textContent = stats.hopeful_alphas_count || '0';
        document.getElementById('stats-fitness').innerHTML = colorizeValue(stats.highest_fitness);
        document.getElementById('stats-sharpe').innerHTML = colorizeValue(stats.avg_sharpe);
    }

    function updateRecentAlphas(recent) {
        const listContainer = document.getElementById('recent-list-container');
        if (!listContainer) return;
        const expandedIndices = new Set();
        listContainer.querySelectorAll('.alpha-item').forEach((item, idx) => {
            const formulaEl = item.querySelector(`#formula-${idx}`);
            if (formulaEl && formulaEl.style.display === 'block') expandedIndices.add(idx);
        });
        if (!recent || recent.length === 0) {
            listContainer.innerHTML = `<div class="muted">暂无最近的 Alpha 数据</div>`; return;
        }
        let content = '';
        recent.forEach((a, idx) => {
            // --- [核心修正] ---
            content += `
                <div class="alpha-item">
                    <div class="alpha-meta">
                        <div><strong>${escapeHtml(a.name || 'Unnamed')}</strong> <span class="small">· ${escapeHtml(a.created_at || 'N/A')}</span></div>
                        <div class="small" style="display: flex; justify-content: space-between; align-items: center;">
                           <span>Fitness: ${colorizeValue(a.fitness)} · Sharpe: ${colorizeValue(a.sharpe)}</span>
                           <strong style="margin-left: 1em;">${colorizeChecksSummary(a.checks_summary)}</strong>
                        </div>
                        <div class="small muted" id="formula-${idx}" style="margin-top:6px; display:none; white-space: pre-wrap; word-break: break-all;">${escapeHtml(a.formula || '无公式信息')}</div>
                    </div>
                    <div class="alpha-actions">
                        <button class="btn" onclick="toggleFormula(${idx})" style="width: 100%;">显示/收起公式</button>
                    </div>
                </div>`;
        });
        listContainer.innerHTML = content;
        if (expandedIndices.size > 0) {
            expandedIndices.forEach(idx => {
                const formulaEl = document.getElementById(`formula-${idx}`);
                if (formulaEl && formulaEl.closest('.alpha-item')) {
                    const btn = formulaEl.closest('.alpha-item').querySelector('.alpha-actions button:first-child');
                    if (btn) {
                       formulaEl.style.display = 'block';
                       btn.textContent = '收起公式';
                    }
                }
            });
        }
    }

    window.toggleFormula = function(idx) {
        const el = document.getElementById(`formula-${idx}`);
        if(!el) return;
        const btn = el.closest('.alpha-item').querySelector('.alpha-actions button:first-child');
        if (el.style.display === 'none') {
            el.style.display = 'block'; btn.textContent = '收起公式';
        } else {
            el.style.display = 'none'; btn.textContent = '显示/收起公式';
        }
    }

    function updateUI() {
        if (isFirstLoad) {
            setupInitialLayout();
            isFirstLoad = false;
        }
        fetch('/api/status').then(res => res.json()).then(updateStatusData).catch(err => console.error("Failed to update status:", err));
        fetch('/api/recent_alphas?n=10').then(res => res.json()).then(data => updateRecentAlphas(data.recent || [])).catch(err => console.error("Failed to fetch recent alphas:", err));
        fetch('/api/logs?lines=200').then(res => res.json()).then(data => {
            const logsContainer = document.getElementById('logs-container');
            if (logsContainer) {
               logsContainer.innerHTML = (data.logs || []).map(line => `<div class="log-line">${colorizeLog(line)}</div>`).join('');
               logsContainer.scrollTop = logsContainer.scrollHeight;
            }
        }).catch(err => console.error("Failed to fetch logs:", err));
    }

    setInterval(updateUI, 10000);
    document.addEventListener('DOMContentLoaded', updateUI);
</script>
</body>
</html>
