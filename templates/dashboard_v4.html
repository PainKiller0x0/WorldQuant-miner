<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WQ Alpha 指挥中心 v4</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; font-size: 14px; }
        .container { max-width: 1600px; margin: auto; display: grid; grid-template-columns: repeat(12, 1fr); gap: 20px; }
        .card { background-color: #1e1e1e; border-radius: 8px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        h2 { color: #bb86fc; border-bottom: 2px solid #3c3c3c; padding-bottom: 10px; margin-top: 0; font-weight: 400; }
        .log-panel { white-space: pre-wrap; word-wrap: break-word; background-color: #2c2c2c; padding: 15px; border-radius: 4px; flex-grow: 1; overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 12px; color: #c8c8c8; height: 350px; }
        #alphas-table-container { max-height: 500px; overflow-y: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #3c3c3c; }
        th { background-color: #333333; position: sticky; top: 0; font-weight: 700; }
        tr:nth-child(even) { background-color: #242424; }
        .grid-col-12 { grid-column: span 12; }
        .grid-col-6 { grid-column: span 6; }
        .grid-col-4 { grid-column: span 4; }
        .highlight-fitness { color: #03dac6; font-weight: bold; }
        .highlight-sharpe { color: #cf6679; font-weight: bold; }
        .highlight-checks-good { color: #76ff03; }
        .highlight-checks-bad { color: #ffab00; }
        .timestamp { font-size: 0.9em; color: #888; }
        .alpha-expression { font-family: 'Courier New', Courier, monospace; word-break: break-all; max-width: 300px; }
        .kpi-container { display: flex; justify-content: space-around; text-align: center; padding: 20px 0; }
        .kpi-item { flex: 1; }
        .kpi-value { font-size: 2.5em; font-weight: 700; color: #03dac6; }
        .kpi-label { font-size: 0.9em; color: #888; margin-top: 5px; }

        @media (max-width: 1200px) {
            .grid-col-6 { grid-column: span 12; }
        }
        @media (max-width: 768px) {
            .grid-col-4 { grid-column: span 12; }
            .kpi-container { flex-direction: column; }
            .kpi-item { margin-bottom: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card grid-col-12">
        <h2>战果概览 (KPIs)</h2>
        <div class="kpi-container">
            <div class="kpi-item">
                <div class="kpi-value" id="kpi-total-hopeful">0</div>
                <div class="kpi-label">已发现高质量 Alpha 总数</div>
            </div>
            <div class="kpi-item">
                <div class="kpi-value" id="kpi-best-fitness">0.000</div>
                <div class="kpi-label">历史最佳 Fitness</div>
            </div>
            <div class="kpi-item">
                <div class="kpi-value" id="kpi-total-tested">0</div>
                <div class="kpi-label">已测试 Alpha 总数</div>
            </div>
        </div>
    </div>

    <div class="card grid-col-6">
        <h2>“发现者”矿机日志 (Discoverer)</h2>
        <div id="miner-log" class="log-panel">正在加载日志...</div>
    </div>
    <div class="card grid-col-6">
        <h2>“进化者”矿机日志 (Evolver)</h2>
        <div id="evolver-log" class="log-panel">正在加载日志...</div>
    </div>

    <div class="card grid-col-12">
        <h2>高质量 Alpha 策略列表</h2>
        <div id="alphas-table-container">
            <table>
                <thead>
                    <tr>
                        <th>Alpha 表达式</th>
                        <th>Fitness</th>
                        <th>Sharpe</th>
                        <th>Checks</th>
                        <th>Delay</th>
                        <th>Decay</th>
                        <th>Trunc.</th>
                        <th>生成时间</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function fetchData() {
        fetch('/api/data')
            .then(response => response.json())
            .then(data => {
                // 更新 KPIs
                document.getElementById('kpi-total-hopeful').textContent = data.kpis.total_hopeful;
                document.getElementById('kpi-best-fitness').textContent = data.kpis.best_fitness;
                document.getElementById('kpi-total-tested').textContent = data.kpis.total_tested;

                // 更新日志
                const minerLog = document.getElementById('miner-log');
                minerLog.textContent = data.miner_log;
                minerLog.scrollTop = minerLog.scrollHeight;

                const evolverLog = document.getElementById('evolver-log');
                evolverLog.textContent = data.evolver_log;
                evolverLog.scrollTop = evolverLog.scrollHeight;
                
                // 更新Alphas表格
                const tableBody = document.querySelector('#alphas-table-container tbody');
                tableBody.innerHTML = ''; 

                data.alphas.forEach(alpha => {
                    const row = tableBody.insertRow();
                    const settings = alpha.performance.settings || {};
                    
                    row.insertCell().textContent = alpha.expression || 'N/A';
                    row.insertCell().innerHTML = `<span class="highlight-fitness">${(alpha.performance.fitness || 0).toFixed(3)}</span>`;
                    row.insertCell().innerHTML = `<span class="highlight-sharpe">${(alpha.performance.sharpe || 0).toFixed(3)}</span>`;
                    row.insertCell().textContent = alpha.checks_summary || 'N/A';
                    row.insertCell().textContent = settings.delay !== undefined ? settings.delay : 'N/A';
                    row.insertCell().textContent = settings.decay !== undefined ? settings.decay : 'N/A';
                    row.insertCell().textContent = settings.truncation !== undefined ? settings.truncation : 'N/A';
                    row.insertCell().textContent = alpha.timestamp || 'N/A';
                });
            })
            .catch(error => console.error('Error fetching data:', error));
    }

    setInterval(fetchData, 3000); // 降低刷新频率以减少负载
    window.onload = fetchData;
</script>

</body>
</html>
