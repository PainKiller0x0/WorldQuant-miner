<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WQ 自动化量化研究团队 - 监控仪表盘 v4.2 (修复版)</title>
    <style>
        /* --- 全局重置与盒模型 --- */
        :root {
            --bg-color: #121212;
            --card-bg-color: #1e1e1e;
            --primary-accent-color: #bb86fc;
            --secondary-accent-color: #03dac6;
            --border-color: #333;
            --text-color: #e0e0e0;
            --text-muted-color: #aaa;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", monospace;
        }

        html {
            box-sizing: border-box;
            overflow-x: hidden; /* 根源上禁止水平滚动 */
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        /* --- 布局 --- */
        .container {
            display: grid;
            grid-template-columns: 1fr; /* 默认单列布局，更适合不同屏幕尺寸 */
            gap: 20px;
            width: 100%;
            max-width: 1600px; /* 为超宽屏设置一个最大宽度 */
            margin: 0 auto;
        }

        /* --- 卡片样式 --- */
        .card {
            background-color: var(--card-bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            overflow: hidden; /* 防止内容溢出 */
        }

        h1, h2 {
            color: var(--primary-accent-color);
            border-bottom: 2px solid #3700b3;
            padding-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin: 0 0 30px 0;
        }

        /* --- KPI 指标 --- */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .kpi {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            border-left: 5px solid var(--secondary-accent-color);
        }

        .kpi-title {
            font-weight: bold;
            color: var(--secondary-accent-color);
            margin-bottom: 5px;
        }

        .kpi-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        /* --- 日志和 Alpha 列表 (解决宽度问题的核心) --- */
        .log-container, .alpha-container {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto; /* 仅允许垂直滚动 */
        }

        .log-container {
            background-color: #2c2c2c;
            height: 250px;
            font-family: var(--font-mono);
            font-size: 0.9em;
            white-space: pre-wrap;   /* 允许文本换行 */
            word-break: break-all;   /* 强制长字符串在任意位置断开 */
        }

        .alpha-container {
            height: 400px;
        }

        .alpha-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .alpha-item {
            background-color: #2a2a2a;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 6px;
            border-left: 5px solid var(--primary-accent-color);
        }

        .alpha-expression {
            font-family: var(--font-mono);
            font-size: 0.95em;
            color: #cfcfcf;
            background-color: #333;
            padding: 5px;
            border-radius: 4px;
            display: block;
            margin-bottom: 10px;
            white-space: pre-wrap;  /* 允许文本换行 */
            word-break: break-all;  /* 强制长字符串在任意位置断开 */
        }

        .alpha-stats {
            font-size: 0.9em;
            color: var(--text-muted-color);
            word-break: normal; /* 统计数据部分不需要强制断词 */
        }

        /* --- 状态颜色与按钮 --- */
        .pass { color: lightgreen; font-weight: bold; }
        .fail { color: lightcoral; font-weight: bold; }
        .pending { color: orange; font-weight: bold; }

        .download-button {
            display: inline-block;
            padding: 8px 15px;
            background-color: #3700b3;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: center;
            transition: background-color 0.2s;
        }

        .download-button:hover {
            background-color: #4a148c;
        }

    </style>
</head>
<body>
    <h1>WQ 自动化量化研究团队 - 监控仪表盘 v4.2</h1>

    <div class="container">
        <div class="card">
            <h2>🕵️‍♂️ 发现者 (Miner)</h2>
            <div class="kpi-grid">
                <div class="kpi">
                    <div class="kpi-title">运行状态</div>
                    <div class="kpi-value" id="miner-status">--</div>
                </div>
                <div class="kpi">
                    <div class="kpi-title">上次心跳</div>
                    <div class="kpi-value" id="miner-last-seen">--</div>
                </div>
            </div>
            <h3>最新日志</h3>
            <a href="/download_logs/miner.log" class="download-button" download>下载完整 Miner 日志</a>
            <div class="log-container" id="miner-logs">正在加载日志...</div>
        </div>

        <div class="card">
            <h2>👨‍🏫 进化者 (Evolver)</h2>
            <div class="kpi-grid">
                <div class="kpi">
                    <div class="kpi-title">运行状态</div>
                    <div class="kpi-value" id="evolver-status">--</div>
                </div>
                <div class="kpi">
                    <div class="kpi-title">上次心跳</div>
                    <div class="kpi-value" id="evolver-last-seen">--</div>
                </div>
            </div>
            <h3>最新日志</h3>
            <a href="/download_logs/evolver.log" class="download-button" download>下载完整 Evolver 日志</a>
            <div class="log-container" id="evolver-logs">正在加载日志...</div>
        </div>

        <div class="card">
            <h2>🏆 精英 Alpha 池 (Hopeful Alphas)</h2>
            <div class="kpi-grid">
                <div class="kpi">
                    <div class="kpi-title">精英总数</div>
                    <div class="kpi-value" id="hopeful-count">--</div>
                </div>
                <div class="kpi">
                    <div class="kpi-title">最高 Fitness</div>
                    <div class="kpi-value" id="max-fitness">--</div>
                </div>
                <div class="kpi">
                    <div class="kpi-title">最高 Sharpe</div>
                    <div class="kpi-value" id="max-sharpe">--</div>
                </div>
                 <div class="kpi">
                    <div class="kpi-title">平均 Fitness</div>
                    <div class="kpi-value" id="avg-fitness">--</div>
                </div>
            </div>
            <div class="alpha-container">
                <ul id="hopeful-alphas-list" class="alpha-list">
                    </ul>
            </div>
        </div>
    </div>

    <script>
        function formatChecks(checksString) {
            if (!checksString) return 'N/A';
            return checksString
                .replace(/(\d+\s*PASS)/g, '<span class="pass">$1</span>')
                .replace(/(\d+\s*FAIL)/g, '<span class="fail">$1</span>')
                .replace(/(\d+\s*PENDING)/g, '<span class="pending">$1</span>');
        }

        function updateStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    // --- 更新 Miner ---
                    const minerStatusEl = document.getElementById('miner-status');
                    minerStatusEl.textContent = data.miner.status;
                    minerStatusEl.style.color = data.miner.status === 'RUNNING' ? 'lightgreen' : 'lightcoral';
                    document.getElementById('miner-last-seen').textContent = data.miner.last_seen;
                    document.getElementById('miner-logs').textContent = data.miner.logs;

                    // --- 更新 Evolver ---
                    const evolverStatusEl = document.getElementById('evolver-status');
                    evolverStatusEl.textContent = data.evolver.status;
                    evolverStatusEl.style.color = data.evolver.status === 'RUNNING' ? 'lightgreen' : 'lightcoral';
                    document.getElementById('evolver-last-seen').textContent = data.evolver.last_seen;
                    document.getElementById('evolver-logs').textContent = data.evolver.logs;
                    
                    // --- 更新精英池统计 ---
                    document.getElementById('hopeful-count').textContent = data.hopeful_alphas.count;
                    document.getElementById('max-fitness').textContent = data.hopeful_alphas.max_fitness.toFixed(3);
                    document.getElementById('max-sharpe').textContent = data.hopeful_alphas.max_sharpe.toFixed(3);
                    document.getElementById('avg-fitness').textContent = data.hopeful_alphas.avg_fitness.toFixed(3);

                    // --- 渲染精英池 Alpha 列表 ---
                    const list = document.getElementById('hopeful-alphas-list');
                    list.innerHTML = ''; 
                    data.hopeful_alphas.all_alphas.forEach(alpha => {
                        const item = document.createElement('li');
                        item.className = 'alpha-item';
                        item.innerHTML = `
                            <code class="alpha-expression">${alpha.expression}</code>
                            <div class="alpha-stats">
                                <strong>Fitness:</strong> ${alpha.fitness.toFixed(3)} | 
                                <strong>Sharpe:</strong> ${alpha.sharpe.toFixed(3)} | 
                                <strong>Checks:</strong> ${formatChecks(alpha.checks)} | 
                                <strong>Timestamp:</strong> ${alpha.timestamp}
                            </div>
                        `;
                        list.appendChild(item);
                    });
                })
                .catch(error => console.error('Error fetching status:', error));
        }

        // --- 启动自动刷新 ---
        setInterval(updateStatus, 5000);
        window.onload = updateStatus;
    </script>
</body>
</html>
