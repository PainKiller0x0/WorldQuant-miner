<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待提交列表 - WQ Alpha 舰队</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif; transition: background-color 0.3s; }
        .alpha-expression { font-family: "SFMono-Regular", Consolas, monospace; font-size: 0.9em; color: #7ec699; max-width: 350px; overflow-x: auto; background-color: var(--bs-tertiary-bg); padding: 5px; border-radius: 4px; cursor: pointer; border: 1px solid var(--bs-border-color); }
        .check-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.85em; font-weight: 600; margin: 2px; color: #fff; }
        .check-tag.pass { background-color: #28a745; } .check-tag.fail { background-color: #dc3545; } .check-tag.pending { background-color: #ffc107; color: #333; } .check-tag.unknown { background-color: #6c757d; }
        .perf-cell { font-size: 0.9em; line-height: 1.6; min-width: 180px; }
        .perf-item { display: flex; justify-content: space-between; align-items: center; }
        .perf-value-copy { cursor: pointer; padding: 2px 6px; border-radius: 4px; background-color: var(--bs-secondary-bg); border: 1px solid var(--bs-border-color); transition: background-color 0.2s; }
        .perf-value-copy:hover { background-color: #0d6efd; color: #fff; }
        #toast { position: fixed; top: 20px; right: 20px; background-color: #28a745; color: white; padding: 15px 20px; border-radius: 5px; z-index: 1056; opacity: 0; transition: opacity 0.5s, top 0.5s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #toast.show { opacity: 1; top: 30px; } #toast.error { background-color: #dc3545; }
        .scroll-buttons { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; }
        .scroll-btn { background-color: var(--bs-secondary-bg); color: var(--bs-body-color); border: 1px solid var(--bs-border-color); border-radius: 5px; padding: 10px 12px; cursor: pointer; opacity: 0.7; font-size: 1.2em; margin-top: 5px; transition: opacity 0.2s; }
        .scroll-btn:hover { background-color: #0d6efd; opacity: 1; color: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top shadow-sm mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-primary" href="/"><i class="bi bi-cpu-fill"></i> WQ Alpha 舰队</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> 仪表盘</a></li>
        <li class="nav-item"><a class="nav-link" href="/chart"><i class="bi bi-graph-up"></i> 统计图表</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings"><i class="bi bi-sliders"></i> 设置</a></li>
        <li class="nav-item"><a class="nav-link active" href="/pending"><i class="bi bi-hourglass-split"></i> 待处理</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-secondary bg-opacity-25 text-body-secondary border border-secondary-subtle d-none d-md-inline">
            Dash: <span id="dashboard-version">...</span> | Gen: <span id="generator-version">...</span>
        </span>
        <button class="btn btn-outline-secondary btn-sm rounded-circle" id="theme-toggle"><i class="bi bi-moon-stars-fill"></i></button>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">
    <div class="card border-0 shadow-sm mt-3">
        <div class="card-header bg-body-tertiary d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="bi bi-clipboard-data"></i> 待提交 Alphas</h5>
            <span class="badge bg-primary rounded-pill fs-6" id="summary">总数: 0</span>
        </div>
        <div class="card-body p-0">
            <div id="loading" class="text-center p-5 text-muted">
                <div class="spinner-border text-primary mb-2" role="status"></div>
                <div>正在加载数据...</div>
            </div>
            
            <div class="table-responsive">
                <table id="alphaTable" class="table table-hover table-striped mb-0 align-middle" style="display:none;">
                    <thead class="table-light">
                        <tr>
                            <th>操作</th>
                            <th data-sort-key="dashboard_score">得分 <i class="bi bi-arrow-down-up sort-icon"></i></th>
                            <th data-sort-key="expression">Alpha 表达式 (点击复制)</th>
                            <th data-sort-key="fitness">性能指标</th>
                            <th data-sort-key="checks_summary_pass">检查摘要</th>
                            <th data-sort-key="timestamp">时间戳</th>
                        </tr>
                    </thead>
                    <tbody id="alphaTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="toast"></div>
<div class="scroll-buttons">
    <button id="scrollToTopBtn" class="scroll-btn" title="顶部">▲</button>
    <button id="scrollToBottomBtn" class="scroll-btn" title="底部">▼</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // --- 主题与版本号逻辑 ---
    const THEME_KEY = 'theme-preference';
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById('theme-toggle');

    function setTheme(theme) {
        htmlEl.setAttribute('data-bs-theme', theme);
        localStorage.setItem(THEME_KEY, theme);
        themeToggle.innerHTML = theme === 'dark' ? '<i class="bi bi-moon-stars-fill"></i>' : '<i class="bi bi-sun-fill"></i>';
    }

    const storedTheme = localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    setTheme(storedTheme);

    themeToggle.addEventListener('click', () => {
        setTheme(htmlEl.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
    });

    fetch('/api/version_info').then(r=>r.json()).then(d=>{
        const dbVer = document.getElementById('dashboard-version');
        if(dbVer) dbVer.textContent = d.dashboard_version;
        const genVer = document.getElementById('generator-version');
        if(genVer) genVer.textContent = d.generator_version;
    }).catch(e=>console.error("Ver info error:", e));
    // --- 结束 ---

    let allAlphas = [];
    let currentSortKey = 'dashboard_score';
    let currentSortDir = 'desc';

    document.addEventListener('DOMContentLoaded', function() {
        fetchPendingAlphas();
        setupSortHeaders();
        setupScrollButtons();
    });

    function fetchPendingAlphas() {
        const loadingDiv = document.getElementById('loading');
        const table = document.getElementById('alphaTable');
        const summarySpan = document.getElementById('summary');

        fetch('/api/get_pending_alphas').then(r=>r.json()).then(data => {
            if(data.error) throw new Error(data.error);
            allAlphas = data.map(alpha => {
                const { pass, fail, pending } = parseChecksSummary(alpha.checks_summary);
                alpha.checks_summary_pass = pass; alpha.checks_summary_fail = fail; alpha.checks_summary_pending = pending;
                alpha.fitness = parseFloat(alpha.fitness)|| -999; alpha.sharpe = parseFloat(alpha.sharpe)|| -999;
                alpha.returns = parseFloat(alpha.returns)||0; alpha.turnover = parseFloat(alpha.turnover)||0;
                return alpha;
            });
            updateSummaryCount(); renderTable();
            loadingDiv.style.display = 'none'; table.style.display = 'table';
        }).catch(err => {
            loadingDiv.innerHTML = `<div class="text-danger">加载失败: ${err.message}</div>`;
        });
    }
    
    function updateSummaryCount() { document.getElementById('summary').textContent = `总数: ${allAlphas.length}`; }

    function setupSortHeaders() {
        document.querySelectorAll('#alphaTable th[data-sort-key]').forEach(th => {
            th.style.cursor = 'pointer';
            th.addEventListener('click', () => {
                const sortKey = th.getAttribute('data-sort-key');
                if (currentSortKey === sortKey) currentSortDir = currentSortDir === 'desc' ? 'asc' : 'desc';
                else { currentSortKey = sortKey; currentSortDir = 'desc'; }
                renderTable();
            });
        });
    }

    function parseChecksSummary(str) {
        if (typeof str !== 'string') return { pass: 0, fail: 0, pending: 0 };
        const p = parseInt((str.match(/(\d+)\s+PASS/i)||[])[1]||0);
        const f = parseInt((str.match(/(\d+)\s+FAIL/i)||[])[1]||0);
        const pd = parseInt((str.match(/(\d+)\s+PENDING/i)||[])[1]||0);
        return { pass: p, fail: f, pending: pd };
    }

    function renderTable() {
        const tbody = document.getElementById('alphaTableBody');
        tbody.innerHTML = '';
        const sorted = [...allAlphas].sort((a, b) => {
            let va = a[currentSortKey], vb = b[currentSortKey];
            if (['expression','timestamp'].includes(currentSortKey)) { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
            else { va = parseFloat(va)||-Infinity; vb = parseFloat(vb)||-Infinity; }
            return (va < vb ? -1 : 1) * (currentSortDir === 'asc' ? 1 : -1);
        });

        if (!sorted.length) { tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">没有待处理的 Alphas</td></tr>'; return; }

        sorted.forEach(a => {
            const row = document.createElement('tr');
            row.setAttribute('data-expression', a.expression);
            
            const fit = a.fitness.toFixed(4), sha = a.sharpe.toFixed(4);
            const ret = (a.returns*100).toFixed(2), trn = (a.turnover*100).toFixed(2);
            const timeStr = a.timestamp ? new Date(a.timestamp).toLocaleString() : 'N/A';
            
            let checksHtml = '';
            if(a.checks_summary_pass > 0) checksHtml += `<span class="check-tag pass">${a.checks_summary_pass} PASS</span>`;
            if(a.checks_summary_fail > 0) checksHtml += `<span class="check-tag fail">${a.checks_summary_fail} FAIL</span>`;
            if(a.checks_summary_pending > 0) checksHtml += `<span class="check-tag pending">${a.checks_summary_pending} PENDING</span>`;
            if(!checksHtml) checksHtml = `<span class="check-tag unknown">N/A</span>`;

            row.innerHTML = `
                <td style="min-width:140px">
                    <div class="d-grid gap-1">
                        <button class="btn btn-outline-primary btn-sm btn-action" data-action="mark-submitted"><i class="bi bi-check-lg"></i> 提交</button>
                        <button class="btn btn-outline-danger btn-sm btn-action" data-action="mark-failed"><i class="bi bi-x-lg"></i> 失败</button>
                    </div>
                </td>
                <td class="fw-bold text-primary">${parseFloat(a.dashboard_score).toFixed(4)}</td>
                <td><div class="alpha-expression" data-copy-value="${escapeHTML(a.expression)}">${escapeHTML(a.expression)}</div></td>
                <td class="perf-cell">
                    <div class="perf-item"><strong>Fit:</strong><span class="perf-value-copy" data-copy-value="${a.fitness.toFixed(2)}">${fit}</span></div>
                    <div class="perf-item"><strong>Shar:</strong><span class="perf-value-copy" data-copy-value="${a.sharpe.toFixed(2)}">${sha}</span></div>
                    <div class="perf-item"><strong>Ret:</strong><span class="perf-value-copy" data-copy-value="${ret}">${ret}%</span></div>
                    <div class="perf-item"><strong>Turn:</strong><span class="perf-value-copy" data-copy-value="${trn}">${trn}%</span></div>
                </td>
                <td>${checksHtml}</td>
                <td class="small text-muted">${timeStr}</td>
            `;
            tbody.appendChild(row);
        });
        setupActionHandlers(tbody);
    }

    function setupActionHandlers(container) {
        container.addEventListener('click', function(e) {
            const t = e.target.closest('.btn-action') || e.target;
            if (t.classList.contains('btn-action')) {
                const action = t.getAttribute('data-action');
                const row = t.closest('tr');
                const expr = row.getAttribute('data-expression');
                if (action === 'mark-submitted') handleMarkSubmitted(expr, row);
                else if (action === 'mark-failed') handleMarkFailed(expr, row);
            }
            if (e.target.closest('.alpha-expression') || e.target.closest('.perf-value-copy')) {
                const val = (e.target.closest('.alpha-expression')||e.target.closest('.perf-value-copy')).getAttribute('data-copy-value');
                copyToClipboard(val);
            }
        });
    }

    function handleMarkSubmitted(expr, row) {
        if (!confirm(`确认标记为“已提交”？\n${expr}`)) return;
        callApi('/api/mark_submitted', {expression: expr}).then(()=>removeRow(row));
    }
    function handleMarkFailed(expr, row) {
        const r = prompt(`请输入失败原因 (如: HIGH_CORR, LOW_FIT):\n${expr}`);
        if(r) callApi('/api/mark_failed_on_wq', {expression: expr, reason: r}).then(()=>removeRow(row));
    }
    function removeRow(row) {
        allAlphas = allAlphas.filter(a => a.expression !== row.getAttribute('data-expression'));
        row.remove(); updateSummaryCount(); if(!allAlphas.length) renderTable();
    }
    async function callApi(url, body) {
        const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
        const d = await r.json(); if(d.status!=='success') alert(d.message);
    }
    function copyToClipboard(text) {
        if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(()=>showToast('已复制'));
        else { const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); showToast('已复制'); }
    }
    function showToast(msg) {
        const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
        setTimeout(()=>t.classList.remove('show'), 2000);
    }
    function escapeHTML(str) { return str ? String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : ''; }
    function setupScrollButtons() {
        document.getElementById('scrollToTopBtn').onclick = ()=>window.scrollTo({top:0, behavior:'smooth'});
        document.getElementById('scrollToBottomBtn').onclick = ()=>window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
    }
</script>
</body>
</html>
