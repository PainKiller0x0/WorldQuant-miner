<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局设置 - WQ Alpha 舰队</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif; transition: background-color 0.3s; }
        [data-bs-theme="dark"] body { background-color: #212529; } [data-bs-theme="light"] body { background-color: #f8f9fa; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top shadow-sm mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-primary" href="/"><i class="bi bi-cpu-fill"></i> WQ Alpha 舰队</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> 仪表盘</a></li>
        <li class="nav-item"><a class="nav-link" href="/chart"><i class="bi bi-graph-up"></i> 统计图表</a></li>
        <li class="nav-item"><a class="nav-link active" href="/settings"><i class="bi bi-sliders"></i> 设置</a></li>
        <li class="nav-item"><a class="nav-link" href="/pending"><i class="bi bi-hourglass-split"></i> 待处理</a></li>
        <li class="nav-item"><a class="nav-link" href="/queue"><i class="bi bi-list-ol"></i> Check 队列</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-secondary bg-opacity-25 text-body-secondary border border-secondary-subtle d-none d-md-inline">
            Dash: <span id="dashboard-version">...</span> | Gen: <span id="generator-version">...</span>
        </span>
        <button class="btn btn-outline-secondary btn-sm rounded-circle" id="theme-toggle"><i class="bi bi-moon-stars-fill"></i></button>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">
    <div class="card mb-4">
        <div class="card-header bg-body-tertiary">
            <h5 class="mb-0"><i class="bi bi-sliders"></i> 舰队指挥中心设置 (v17.0)</h5>
        </div>
        <div class="card-body">
            <form id="settings-form">
    
                <h5 class="border-bottom pb-2 mb-3 text-primary"><i class="bi bi-wallet2"></i> 看门狗 A：API 舰队预算 (次/天)</h5>
                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card h-100 border-0 bg-body-secondary bg-opacity-25">
                            <div class="card-body">
                                <h6 class="card-title text-primary fw-bold mb-3"><i class="bi bi-minecart-loaded"></i> Miner 舰队</h6>
                                <div class="mb-2">
                                    <label class="form-label small">主力 (Miner)</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text"><i class="bi bi-star-fill text-warning"></i></span>
                                        <input type="number" class="form-control" id="miner_daily_limit" name="miner_daily_limit" min="0">
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small">备用 1 (Backup 1)</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text"><i class="bi bi-shield-shaded"></i></span>
                                        <input type="number" class="form-control" id="miner_backup_1_limit" name="miner_backup_1_limit" min="0" placeholder="默认 1000">
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small">备用 2 (Backup 2)</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text"><i class="bi bi-shield"></i></span>
                                        <input type="number" class="form-control" id="miner_backup_2_limit" name="miner_backup_2_limit" min="0" placeholder="未配置">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6">
                        <div class="card h-100 border-0 bg-body-secondary bg-opacity-25">
                            <div class="card-body">
                                <h6 class="card-title text-success fw-bold mb-3"><i class="bi bi-dna"></i> Evolver 舰队</h6>
                                <div class="mb-2">
                                    <label class="form-label small">主力 (Evolver)</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text"><i class="bi bi-star-fill text-warning"></i></span>
                                        <input type="number" class="form-control" id="evolver_daily_limit" name="evolver_daily_limit" min="0">
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small">备用 1 (Backup 1)</label>
                                    <div class="input-group input-group-sm">
                                        <span class="input-group-text"><i class="bi bi-shield-shaded"></i></span>
                                        <input type="number" class="form-control" id="evolver_backup_1_limit" name="evolver_backup_1_limit" min="0" placeholder="默认 1000">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <h5 class="border-bottom pb-2 mb-3 mt-4 text-warning"><i class="bi bi-shield-lock"></i> 看门狗 B：WQ API 防护</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="wq_429_cooldown_seconds" class="form-label small">429 冷却时间 (秒)</label>
                        <input type="number" class="form-control" id="wq_429_cooldown_seconds" name="wq_429_cooldown_seconds" min="0">
                    </div>
                    <div class="col-md-4">
                        <label for="max_tpm_limit" class="form-label small">最大 TPM 上限</label>
                        <input type="number" class="form-control" id="max_tpm_limit" name="max_tpm_limit" min="1">
                    </div>
                     <div class="col-md-4">
                        <label for="min_tpm_limit" class="form-label small">最小 TPM 下限</label>
                        <input type="number" class="form-control" id="min_tpm_limit" name="min_tpm_limit" min="1">
                    </div>
                </div>

                <h5 class="border-bottom pb-2 mb-3 mt-4 text-info"><i class="bi bi-gear-wide-connected"></i> 核心服务参数 (需重启)</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="miner_concurrency" class="form-label small">Miner 并发线程</label>
                        <input type="number" class="form-control" id="miner_concurrency" name="miner_concurrency" min="0">
                    </div>
                    <div class="col-md-4">
                        <label for="evolver_concurrency" class="form-label small">Evolver 并发线程</label>
                        <input type="number" class="form-control" id="evolver_concurrency" name="evolver_concurrency" min="0">
                    </div>
                     <div class="col-md-4">
                        <label for="producer_queue_full_sleep" class="form-label small">队列满休眠 (秒)</label>
                        <input type="number" class="form-control" id="producer_queue_full_sleep" name="producer_queue_full_sleep" min="0">
                    </div>
                    
                    <div class="col-md-4">
                        <label for="pool_limit_unsubmitted" class="form-label small text-primary fw-bold"><i class="bi bi-basket"></i> 潜力池上限 (未提交)</label>
                        <input type="number" class="form-control" id="pool_limit_unsubmitted" name="pool_limit_unsubmitted" min="10" placeholder="默认 300">
                        <div class="form-text" style="font-size: 0.75rem;">新生成的候选策略池大小。</div>
                    </div>
                    <div class="col-md-4">
                        <label for="pool_limit_submitted" class="form-label small text-success fw-bold"><i class="bi bi-archive"></i> 荣誉池上限 (已提交)</label>
                        <input type="number" class="form-control" id="pool_limit_submitted" name="pool_limit_submitted" min="10" placeholder="默认 1000">
                        <div class="form-text" style="font-size: 0.75rem;">保留已提交策略的历史记录数。</div>
                    </div>
                    
                    <div class="col-md-4">
                        <label for="evolver_wildcard_count" class="form-label small">Evolver 外卡数</label>
                        <input type="number" class="form-control" id="evolver_wildcard_count" name="evolver_wildcard_count" min="0">
                    </div>
                </div>
                
                <div class="mt-4 pt-3 border-top d-flex gap-2">
                     <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> 保存所有设置</button>
                     <button type="button" class="btn btn-outline-secondary" id="copy-restart-cmd"><i class="bi bi-clipboard"></i> 复制重启命令</button>
                </div>
                
                <div id="message" class="alert mt-3" style="display: none;" role="alert"></div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 主题逻辑
    const THEME_KEY = 'theme-preference'; const htmlEl = document.documentElement; const themeToggle = document.getElementById('theme-toggle');
    function setTheme(theme) { htmlEl.setAttribute('data-bs-theme', theme); localStorage.setItem(THEME_KEY, theme); themeToggle.innerHTML = theme === 'dark' ? '<i class="bi bi-moon-stars-fill"></i>' : '<i class="bi bi-sun-fill"></i>'; }
    const storedTheme = localStorage.getItem(THEME_KEY) || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    setTheme(storedTheme);
    themeToggle.addEventListener('click', () => { setTheme(htmlEl.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark'); });
    fetch('/api/version_info').then(r=>r.json()).then(d=>{
        const dbVer = document.getElementById('dashboard-version'); if(dbVer) dbVer.textContent = d.dashboard_version;
        const genVer = document.getElementById('generator-version'); if(genVer) genVer.textContent = d.generator_version;
    });

    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('settings-form');
        const messageEl = document.getElementById('message');
        const copyButton = document.getElementById('copy-restart-cmd');
        
        function showMessage(type, html) {
            messageEl.className = 'alert mt-3 ' + (type === 'success' ? 'alert-success' : (type === 'error' ? 'alert-danger' : 'alert-warning'));
            messageEl.innerHTML = html; messageEl.style.display = 'block';
            setTimeout(() => messageEl.style.display = 'none', 5000);
        }

        // 1. 加载配置
        fetch('/api/get_settings').then(r=>r.json()).then(data => {
            // 基础参数 (v17.0 新增双池参数)
            ['miner_concurrency', 'evolver_concurrency', 'producer_queue_full_sleep', 
             'pool_limit_unsubmitted', 'pool_limit_submitted', 'evolver_wildcard_count'].forEach(k => { 
                if(form.elements[k]) form.elements[k].value = data[k]||0; 
            });
            
            // 兼容旧版配置: 如果 unsubmitted 未设置，回退到 hopeful_pool_max_size
            if((!data.pool_limit_unsubmitted || data.pool_limit_unsubmitted == 0) && data.hopeful_pool_max_size) {
                if(form.elements['pool_limit_unsubmitted']) form.elements['pool_limit_unsubmitted'].value = data.hopeful_pool_max_size;
            }

            // WQ 看门狗
            if (data.wq_api_limiter) { 
                ['wq_429_cooldown_seconds', 'max_tpm_limit', 'min_tpm_limit'].forEach(k => { 
                    if(form.elements[k]) form.elements[k].value = data.wq_api_limiter[k]; 
                }); 
            }
            // API 舰队预算
            if (data.llm_budgets) {
                if(data.llm_budgets.miner) form.elements['miner_daily_limit'].value = data.llm_budgets.miner.daily_limit;
                if(data.llm_budgets.miner_backup_1) form.elements['miner_backup_1_limit'].value = data.llm_budgets.miner_backup_1.daily_limit;
                if(data.llm_budgets.miner_backup_2 && form.elements['miner_backup_2_limit']) 
                    form.elements['miner_backup_2_limit'].value = data.llm_budgets.miner_backup_2.daily_limit;
                
                if(data.llm_budgets.evolver) form.elements['evolver_daily_limit'].value = data.llm_budgets.evolver.daily_limit;
                if(data.llm_budgets.evolver_backup_1) form.elements['evolver_backup_1_limit'].value = data.llm_budgets.evolver_backup_1.daily_limit;
            }
        }).catch(err => showMessage('error', `加载错误: ${err}`));

        // 2. 保存配置
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const data = { llm_budgets:{}, wq_api_limiter:{}, evolver_search_space:{} };
            
            // 预算保存
            const saveBudget = (role) => {
                const val = parseInt(form.elements[role + '_limit'].value);
                if (!isNaN(val)) data.llm_budgets[role] = { daily_limit: val };
            };
            saveBudget('miner_daily'); saveBudget('miner_backup_1'); saveBudget('miner_backup_2');
            saveBudget('evolver_daily'); saveBudget('evolver_backup_1');
            
            // 修正 Key 映射
            if(data.llm_budgets.miner_daily) { data.llm_budgets.miner = data.llm_budgets.miner_daily; delete data.llm_budgets.miner_daily; }
            if(data.llm_budgets.evolver_daily) { data.llm_budgets.evolver = data.llm_budgets.evolver_daily; delete data.llm_budgets.evolver_daily; }

            // 保存服务参数 (包括 v17.0 双池)
            ['miner_concurrency', 'evolver_concurrency', 'producer_queue_full_sleep', 
             'pool_limit_unsubmitted', 'pool_limit_submitted', 'evolver_wildcard_count'].forEach(k => data[k]=parseInt(form.elements[k].value));
            
            // 兼容旧字段: 同步 pool_limit_unsubmitted 到 hopeful_pool_max_size 以防万一
            data['hopeful_pool_max_size'] = data['pool_limit_unsubmitted'];

            // WQ 参数
            ['wq_429_cooldown_seconds', 'max_tpm_limit', 'min_tpm_limit'].forEach(k => data.wq_api_limiter[k]=parseInt(form.elements[k].value));
            
            showMessage('warning', '正在保存...');
            fetch('/api/save_settings', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)})
                .then(r=>r.json()).then(res => {
                    if(res.status==='success') showMessage('success', '配置已保存！部分参数需重启生效。');
                    else showMessage('error', res.message);
                }).catch(err => showMessage('error', err));
        });

        // 3. 复制命令
        const cmd = 'docker compose -f docker-compose.yml -f docker-compose.evolver.yml -f docker-compose.dashboard.yml -f docker-compose.backup.yml up -d --build --force-recreate'; 
        copyButton.onclick = function() {
            const t=document.createElement('textarea'); t.value=cmd; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);
            const ori=this.innerHTML; this.innerHTML='<i class="bi bi-check"></i> 已复制!'; setTimeout(()=>this.innerHTML=ori,2000);
        };
    });
</script>
</body>
</html>
